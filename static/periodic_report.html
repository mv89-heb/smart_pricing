<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוח חיובים חודשי ותקופתי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Heebo','sans-serif']}}}};</script>
<style>
body{font-family:Heebo,sans-serif}.num{font-variant-numeric:tabular-nums}.modal{background:rgba(15,23,42,.62);backdrop-filter:blur(4px)}
@media print{.no-print{display:none!important}body{background:#fff!important}.card{box-shadow:none!important;border:1px solid #ddd!important}}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
<main id="reports-module" data-module="reports" class="w-full p-4 sm:p-6">
<section class="card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-4 mb-5 no-print">
<div class="flex flex-wrap gap-2 mb-4"><button onclick="setPreset('current')" class="preset px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-bold">חודש נוכחי</button><button onclick="setPreset('previous')" class="preset px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-bold">חודש קודם</button><button onclick="setPreset('year')" class="preset px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-bold">מתחילת השנה</button><button onclick="setPreset('custom')" class="preset px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-bold">טווח מותאם</button></div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end"><div><label class="block text-xs font-bold text-slate-500 mb-1">מתאריך</label><input id="fromDate" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950"></div><div><label class="block text-xs font-bold text-slate-500 mb-1">עד תאריך</label><input id="toDate" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950"></div><div><button onclick="loadReport()" class="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold"><i class="fa-solid fa-magnifying-glass ml-1"></i> הצג דוח</button></div><div><button onclick="exportExcel()" class="w-full px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold"><i class="fa-solid fa-file-excel ml-1"></i> Excel</button></div><div><button onclick="window.print()" class="w-full px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 text-white font-bold"><i class="fa-solid fa-print ml-1"></i> הדפסה</button></div></div><p id="rangeError" class="hidden text-rose-600 text-sm font-bold mt-3"></p>
</section>
<section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500 font-bold">סה״כ לתשלום</p><p id="grandTotal" class="num text-2xl font-extrabold mt-1">0.00 ₪</p></div><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500 font-bold">חיובים שוטפים</p><p id="regularTotal" class="num text-xl font-extrabold text-indigo-600 mt-1">0.00 ₪</p></div><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500 font-bold">אקסטרה</p><p id="extraTotal" class="num text-xl font-extrabold text-amber-600 mt-1">0.00 ₪</p></div><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500 font-bold">ימי חיוב</p><p id="daysCount" class="num text-xl font-extrabold mt-1">0</p></div><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 col-span-2 lg:col-span-1"><p class="text-xs text-slate-500 font-bold">ממוצע ליום חיוב</p><p id="averageDay" class="num text-xl font-extrabold mt-1">0.00 ₪</p></div></section>
<section class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden mb-5"><div class="p-4 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center"><div><h2 class="font-extrabold text-lg">פירוט לפי ימים</h2><p id="periodTitle" class="text-xs text-slate-500"></p></div><div class="no-print flex gap-2"><input id="search" oninput="renderTable()" placeholder="חיפוש מוצר / הערה" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm"></div></div><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-slate-50 dark:bg-slate-950"><tr><th class="px-4 py-3 text-right">תאריך</th><th class="px-4 py-3 text-right">מוצר</th><th class="px-4 py-3 text-center">סוג</th><th class="px-4 py-3 text-center">כמות</th><th class="px-4 py-3 text-left">מחיר יח׳</th><th class="px-4 py-3 text-left">סה״כ</th><th class="px-4 py-3 text-right">הערה</th><th class="px-4 py-3 text-center no-print">פעולות</th></tr></thead><tbody id="reportBody"></tbody></table></div><div id="empty" class="hidden p-12 text-center text-slate-400"><i class="fa-solid fa-inbox text-4xl mb-3"></i><p class="font-bold">אין חיובים בטווח שנבחר</p></div></section>
<section class="grid grid-cols-1 lg:grid-cols-2 gap-5"><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><h3 class="font-extrabold mb-4">סיכום לפי מוצר</h3><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead><tr class="border-b dark:border-slate-800"><th class="py-2 text-right">מוצר</th><th class="py-2 text-center">כמות</th><th class="py-2 text-left">סה״כ</th></tr></thead><tbody id="productSummary"></tbody></table></div></div><div class="card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5"><h3 class="font-extrabold mb-4">סיכום לפי יום</h3><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead><tr class="border-b dark:border-slate-800"><th class="py-2 text-right">תאריך</th><th class="py-2 text-center">שוטף</th><th class="py-2 text-center">אקסטרה</th><th class="py-2 text-left">סה״כ</th></tr></thead><tbody id="daySummary"></tbody></table></div></div></section>
</main>
<div id="editModal" class="hidden fixed inset-0 modal z-50 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle"><div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md p-5"><div class="flex justify-between items-center mb-4"><h3 id="editDialogTitle" class="font-extrabold text-lg">עריכת חיוב</h3><button onclick="closeEdit()" class="text-slate-400" aria-label="סגירת חלון עריכה"><i class="fa-solid fa-xmark text-xl"></i></button></div><input type="hidden" id="editId"><p id="editProduct" class="font-bold mb-4"></p><label class="block text-xs font-bold text-slate-500 mb-1" for="editQty">כמות</label><input id="editQty" type="number" step="0.01" min="0.01" class="w-full px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950 mb-3"><label class="block text-xs font-bold text-slate-500 mb-1" for="editNote">הערה</label><input id="editNote" class="w-full px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950 mb-3"><label class="flex items-center gap-2 text-sm font-bold mb-5"><input id="editExtra" type="checkbox"> אקסטרה</label><div class="flex gap-2"><button onclick="saveEdit()" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 font-bold">שמור</button><button onclick="closeEdit()" class="px-5 bg-slate-100 dark:bg-slate-800 rounded-lg font-bold">ביטול</button></div></div></div>
</body>
</html>
