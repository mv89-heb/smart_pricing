<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | ניהול חיובים</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Heebo','sans-serif']}}}}</script><style>body{font-family:Heebo,sans-serif}.num{font-variant-numeric:tabular-nums}</style></head><body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen"><div id="app" class="max-w-7xl mx-auto p-4 sm:p-6"><header class="flex flex-col sm:flex-row justify-between gap-4 items-start sm:items-center mb-6"><div><p class="text-indigo-600 font-bold text-sm">מרכז שליטה</p><h1 class="text-3xl font-extrabold">Dashboard חיובים</h1><p id="subtitle" class="text-slate-500 text-sm mt-1"></p></div><div class="flex gap-2 flex-wrap"><a href="/" class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-bold">יומי</a><a href="/periodic-report" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">דוח תקופתי</a><button onclick="toggleDark()" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">◐</button></div></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"><div class="bg-white dark:bg-slate-900 rounded-2xl border p-4"><p class="text-xs text-slate-500 font-bold">החודש</p><p id="monthTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p><p id="monthDelta" class="text-xs mt-1"></p></div><div class="bg-white dark:bg-slate-900 rounded-2xl border p-4"><p class="text-xs text-slate-500 font-bold">היום</p><p id="todayTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p></div><div class="bg-white dark:bg-slate-900 rounded-2xl border p-4"><p class="text-xs text-slate-500 font-bold">ממוצע יומי</p><p id="avgTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p></div><div class="bg-white dark:bg-slate-900 rounded-2xl border p-4"><p class="text-xs text-slate-500 font-bold">שוטף</p><p id="regularTotal" class="num text-xl font-extrabold text-indigo-600 mt-1">₪0.00</p></div><div class="bg-white dark:bg-slate-900 rounded-2xl border p-4"><p class="text-xs text-slate-500 font-bold">אקסטרה</p><p id="extraTotal" class="num text-xl font-extrabold text-amber-600 mt-1">₪0.00</p></div></section><section class="grid lg:grid-cols-3 gap-5 mb-5"><div class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-extrabold">מגמת חיובים</h2><span id="daysLabel" class="text-xs text-slate-500"></span></div><div class="h-72"><canvas id="trend"></canvas></div></div><div class="bg-white dark:bg-slate-900 rounded-2xl border p-5"><h2 class="font-extrabold mb-4">מובילים לפי מוצר</h2><div id="products" class="space-y-3"></div></div></section><section class="bg-white dark:bg-slate-900 rounded-2xl border p-5 mb-5"><div class="flex flex-col sm:flex-row gap-3 justify-between sm:items-center mb-4"><div><h2 class="font-extrabold">השוואת תקופות</h2><p class="text-xs text-slate-500">השוואה בין שני טווחי תאריכים</p></div><div class="flex gap-2 flex-wrap"><input id="aFrom" type="date" class="px-3 py-2 rounded-lg border"><input id="aTo" type="date" class="px-3 py-2 rounded-lg border"><input id="bFrom" type="date" class="px-3 py-2 rounded-lg border"><input id="bTo" type="date" class="px-3 py-2 rounded-lg border"><button onclick="compare()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">השווה</button></div></div><div id="compareGrid" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div></section></div><script>const $=id=>document.getElementById(id),money=n=>'₪'+(Number(n)||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});async function api(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location.href='/login';return null}if(!r.ok)throw new Error('API '+r.status);return r}function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function bounds(o=0){const d=new Date();d.setMonth(d.getMonth()+o);return [new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)]}async function summary(a,b){const r=await api('/api/dashboard/summary?from='+encodeURIComponent(a)+'&to='+encodeURIComponent(b));return r.json()}async function init(){try{const[f,t]=bounds(),[pf,pt]=bounds(-1),now=fmt(new Date());const [cur,prev,today]=await Promise.all([summary(fmt(f),fmt(t)),summary(fmt(pf),fmt(pt)),summary(now,now)]),s=cur.summary||{};$('subtitle').textContent='נתוני חודש '+f.toLocaleDateString('he-IL',{month:'long',year:'numeric'});$('monthTotal').textContent=money(s.grand_total);$('todayTotal').textContent=money(today.summary?.grand_total);$('avgTotal').textContent=money(s.average_day);$('regularTotal').textContent=money(s.regular_total);$('extraTotal').textContent=money(s.extra_total);const delta=(s.grand_total||0)-(prev.summary?.grand_total||0),pct=prev.summary?.grand_total?delta/prev.summary.grand_total*100:0;$('monthDelta').textContent=(delta>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(1)+'% לעומת החודש הקודם';$('monthDelta').className='text-xs mt-1 '+(delta>=0?'text-emerald-600':'text-rose-600');$('daysLabel').textContent=(s.days_count||0)+' ימים';const days=cur.day_summary||{},labels=Object.keys(days).sort();new Chart($('trend'),{type:'line',data:{labels,datasets:[{label:'סה״כ',data:labels.map(x=>days[x].total),tension:.3},{label:'שוטף',data:labels.map(x=>days[x].regular),tension:.3}]},options:{responsive:true,maintainAspectRatio:false}});const rows=Object.entries(cur.product_summary||{}).sort((a,b)=>b[1].total-a[1].total).slice(0,8),max=rows[0]?.[1].total||1;$('products').innerHTML=rows.map(([n,x])=>`<div><div class="flex justify-between text-sm font-bold"><span>${esc(n)}</span><span>${money(x.total)}</span></div><div class="h-2 bg-slate-100 rounded-full mt-1"><div class="h-2 bg-indigo-500 rounded-full" style="width:${Math.min(100,x.total/max*100)}%"></div></div></div>`).join('')||'<p class="text-slate-400">אין נתונים</p>';setDefaults()}catch(e){console.error(e);$('subtitle').textContent='לא ניתן לטעון את נתוני הדשבורד';}}function setDefaults(){const[f,t]=bounds(),[pf,pt]=bounds(-1);$('aFrom').value=fmt(f);$('aTo').value=fmt(t);$('bFrom').value=fmt(pf);$('bTo').value=fmt(pt)}async function compare(){const btn=event?.currentTarget;try{if(btn)btn.disabled=true;const r=await api('/api/dashboard/compare?a_from='+encodeURIComponent($('aFrom').value)+'&a_to='+encodeURIComponent($('aTo').value)+'&b_from='+encodeURIComponent($('bFrom').value)+'&b_to='+encodeURIComponent($('bTo').value)),x=await r.json(),at=Number(x.a?.grand_total)||0,bt=Number(x.b?.grand_total)||0,d=at-bt,p=x.change?.grand_total??(bt?d/bt*100:0);$('compareGrid').innerHTML=`<div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-500">תקופה א׳</p><p class="num text-2xl font-extrabold">${money(at)}</p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-500">תקופה ב׳</p><p class="num text-2xl font-extrabold">${money(bt)}</p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-500">שינוי</p><p class="num text-2xl font-extrabold ${d>=0?'text-emerald-600':'text-rose-600'}">${money(d)}</p><p class="font-bold">${p>=0?'▲':'▼'} ${Math.abs(p||0).toFixed(1)}%</p></div>`}catch(e){console.error(e);$('compareGrid').innerHTML='<p class="text-rose-600 font-bold">לא ניתן לבצע את ההשוואה</p>'}finally{if(btn)btn.disabled=false}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggleDark(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');init();</script></body></html>
