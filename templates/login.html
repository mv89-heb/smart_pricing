<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Pricing | התחברות</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@700;800;900&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-slate-950 flex items-center justify-center p-4" style="font-family:Assistant,sans-serif"><div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8"><div class="text-center mb-8"><div class="inline-flex bg-blue-600 text-white rounded-2xl p-4 mb-4 text-2xl">₪</div><h1 class="text-3xl font-black text-slate-900">Smart Pricing</h1><p class="text-slate-500 mt-2">כניסה מאובטחת למערכת</p></div>{% if error %}<div class="bg-red-50 text-red-700 rounded-xl p-3 mb-4 font-bold text-sm">{{error}}</div>{% endif %}<form method="post" class="space-y-5"><div><label class="block text-sm font-bold mb-2">אימייל</label><input name="email" type="email" autocomplete="username" required class="w-full rounded-xl border border-slate-200 p-3.5 outline-none focus:border-blue-500"></div><div><label class="block text-sm font-bold mb-2">סיסמה</label><input name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-200 p-3.5 outline-none focus:border-blue-500"></div><button class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white py-3.5 font-black">התחבר</button></form></div></body></html>
