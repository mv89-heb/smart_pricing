<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Pricing — כניסה</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Heebo,sans-serif;background:radial-gradient(circle at 15% 15%,#eef2ff,transparent 32%),linear-gradient(135deg,#f8fafc,#eef2ff)}</style></head><body class="min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-md"><div class="bg-white border border-slate-200 rounded-3xl shadow-xl overflow-hidden"><div class="p-8 bg-slate-950 text-white"><div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-xl mb-5">₪</div><div class="text-xs font-bold text-indigo-300 tracking-widest">SMART PRICING</div><h1 class="text-3xl font-black mt-1">ברוכים הבאים</h1><p class="text-slate-400 text-sm mt-2">כניסה למערכת ניהול החיובים והמחירים</p></div><form id="login-form" class="p-8 space-y-5"><div><label class="block text-sm font-bold text-slate-700 mb-2">שם משתמש</label><input id="username" autocomplete="username" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="שם משתמש"></div><div><label class="block text-sm font-bold text-slate-700 mb-2">סיסמה</label><input id="password" type="password" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="סיסמה"></div><div id="error" class="hidden rounded-xl p-3 text-sm font-bold bg-red-50 text-red-700"></div><button id="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-black transition" type="submit">כניסה למערכת</button><p class="text-center text-xs text-slate-400">גישה מאובטחת · הנתונים נשארים במערכת</p></form></div></main><script>const f=document.getElementById('login-form'),err=document.getElementById('error'),btn=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();err.classList.add('hidden');btn.disabled=true;btn.textContent='מתחבר...';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'פרטי הכניסה שגויים');location.href='/'}catch(e){err.textContent=e.message;err.classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='כניסה למערכת'}});</script></body></html>
