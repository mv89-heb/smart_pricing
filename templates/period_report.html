<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Pricing — דוח חיובים לפי תקופה</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--brand:#4f46e5}*{box-sizing:border-box}body{font-family:Heebo,sans-serif;background:#f8fafc;color:#0f172a}.number{direction:ltr;unicode-bidi:plaintext}.report-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.price-card{position:sticky;top:20px;height:calc(100vh - 40px)}.table-scroll{max-height:calc(100vh - 380px)}.sticky-head th{position:sticky;top:0;z-index:5}@media(max-width:1100px){.report-grid{grid-template-columns:1fr}.price-card{position:relative;height:auto;min-height:420px}.table-scroll{max-height:620px}}@media(max-width:1023px){.sp-report-page{padding-bottom:80px}}</style></head><body class="sp-report-page min-h-screen"><main class="px-3 sm:px-5 lg:px-7 py-4 max-w-[1700px] mx-auto"><header class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 mb-4 flex items-center justify-between gap-3"><div><h1 class="text-2xl font-extrabold">דוח חיובים לפי תקופה</h1><p class="text-sm text-slate-500">כל הנתונים בטווח שנבחר — ברירת מחדל: 3 חודשים אחורה</p></div><a href="/logout" class="px-3 py-2 rounded-lg bg-red-50 text-red-600 font-bold">יציאה</a></header><div class="report-grid"><section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden"><div class="p-4 border-b border-slate-100 flex flex-wrap items-end gap-2"><label class="text-xs font-bold">מתאריך<input id="start-date" type="date" class="block mt-1 px-3 py-2 border rounded-lg"></label><label class="text-xs font-bold">עד תאריך<input id="end-date" type="date" class="block mt-1 px-3 py-2 border rounded-lg"></label><button data-months="3" class="preset px-3 py-2 rounded-lg bg-indigo-600 text-white font-bold">3 חודשים</button><button data-months="6" class="preset px-3 py-2 rounded-lg bg-slate-100 font-bold">6 חודשים</button><button data-month="current" class="preset px-3 py-2 rounded-lg bg-slate-100 font-bold">חודש נוכחי</button><button data-days="7" class="preset px-3 py-2 rounded-lg bg-slate-100 font-bold">7 ימים</button><button id="load-report" class="px-4 py-2 rounded-lg bg-slate-900 text-white font-bold">הצג נתונים</button></div><div class="grid grid-cols-2 lg:grid-cols-5 gap-3 p-4 border-b"><div class="p-3 rounded-xl bg-blue-50"><p class="text-xs text-slate-500">מספר חיובים</p><b id="summary-entries" class="text-2xl">0</b></div><div class="p-3 rounded-xl bg-amber-50"><p class="text-xs text-slate-500">סה״כ כמות</p><b id="summary-quantity" class="text-2xl">0</b></div><div class="p-3 rounded-xl bg-indigo-50"><p class="text-xs text-slate-500">רגילים</p><b id="summary-regular">0 ₪</b></div><div class="p-3 rounded-xl bg-orange-50"><p class="text-xs text-slate-500">אקסטרות</p><b id="summary-extra">0 ₪</b></div><div class="p-3 rounded-xl bg-slate-900 text-white"><p class="text-xs text-slate-300">סה״כ לתקופה</p><b id="summary-total">0 ₪</b></div></div><div class="p-3 border-b flex items-center justify-between gap-3"><b id="period-label">טוען...</b><input id="table-search" class="w-80 max-w-full px-3 py-2 border rounded-lg" placeholder="חיפוש מוצר או תאריך..."></div><div class="table-scroll overflow-auto"><table class="min-w-full text-sm"><thead class="sticky-head bg-slate-100"><tr><th class="p-3 text-right">תאריך</th><th class="p-3 text-right">מוצר</th><th class="p-3">סוג</th><th class="p-3">כמות</th><th class="p-3">מחיר יחידה</th><th class="p-3">סה״כ</th></tr></thead><tbody id="report-body" class="divide-y"></tbody></table></div><div id="empty-state" class="hidden p-10 text-center text-slate-500">אין חיובים בתקופה שנבחרה</div></section><aside class="price-card bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col"><div class="p-4 border-b bg-slate-50 flex items-center justify-between"><div><h2 class="font-extrabold text-lg">מחירון מוצרים</h2><p id="product-count" class="text-xs text-slate-400">טוען...</p></div><a href="/products/new" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-bold"><i class="fa-solid fa-plus"></i> מוצר חדש</a></div><div class="p-3 border-b"><input id="product-search" class="w-full px-3 py-2 border rounded-lg" placeholder="חיפוש מוצר..."></div><div class="overflow-auto flex-1"><table class="min-w-full text-sm"><thead class="sticky-head bg-slate-100"><tr><th class="p-3 text-right">מוצר</th><th class="p-3">מחיר</th><th class="p-3">נוסף</th><th class="p-3">פעולות</th></tr></thead><tbody id="product-body" class="divide-y"></tbody></table></div></aside></div></main><div id="edit-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl"><h3 class="text-xl font-extrabold mb-4">עריכת מוצר</h3><input id="edit-name" class="w-full px-3 py-2 border rounded-lg mb-3"><input id="edit-price" type="number" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg mb-4 number"><div id="edit-error" class="hidden text-red-600 text-sm font-bold mb-3"></div><div class="flex gap-2"><button id="save-edit" class="flex-1 px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">שמור</button><button id="cancel-edit" class="px-4 py-2 rounded-lg bg-slate-100 font-bold">ביטול</button></div></div></div><script>
const $=id=>document.getElementById(id);let rows=[],products=[],editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' ₪';const iso=d=>d.toISOString().slice(0,10);const dateFmt=v=>{const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v};function monthsAgo(n){const d=new Date();d.setHours(0,0,0,0);d.setMonth(d.getMonth()-n);return iso(d)}
async function loadReport(){const s=$('start-date').value,e=$('end-date').value;if(!s||!e)return;const b=$('load-report');b.disabled=true;try{const r=await fetch(`/api/report/range?start_date=${s}&end_date=${e}`);const d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');rows=d.rows||[];$('summary-entries').textContent=(d.summary.entries||0).toLocaleString('he-IL');$('summary-quantity').textContent=(d.summary.quantity||0).toLocaleString('he-IL',{maximumFractionDigits:2});$('summary-regular').textContent=money(d.summary.regular_total);$('summary-extra').textContent=money(d.summary.extra_total);$('summary-total').textContent=money(d.summary.grand_total);$('period-label').textContent=`${dateFmt(s)} — ${dateFmt(e)}`;renderRows()}catch(x){alert(x.message)}finally{b.disabled=false}}
function renderRows(){const q=$('table-search').value.trim().toLowerCase();const v=rows.filter(r=>`${r.product_name} ${r.date}`.toLowerCase().includes(q));$('report-body').innerHTML=v.map(r=>`<tr class="hover:bg-slate-50 ${r.is_extra?'bg-orange-50/30':''}"><td class="p-3">${dateFmt(r.date)}</td><td class="p-3 font-bold">${esc(r.product_name)}</td><td class="p-3 text-center">${r.is_extra?'אקסטרה':'רגיל'}</td><td class="p-3 text-center number">${Number(r.quantity).toLocaleString('he-IL')}</td><td class="p-3 text-center">${money(r.unit_price)}</td><td class="p-3 text-center font-bold">${money(r.total)}</td></tr>`).join('');$('empty-state').classList.toggle('hidden',v.length>0)}
async function loadProducts(){const r=await fetch('/api/report/products');const d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה בטעינת המחירון');products=d.products||[];$('product-count').textContent=`${products.length} מוצרים`;renderProducts()}
function renderProducts(){const q=$('product-search').value.trim().toLowerCase();const v=products.filter(p=>p.name.toLowerCase().includes(q));$('product-body').innerHTML=v.map(p=>`<tr><td class="p-3 font-bold">${esc(p.name)}</td><td class="p-3 text-center font-bold">${money(p.price)}</td><td class="p-3 text-center text-xs text-slate-500">${p.added_at?dateFmt(p.added_at):'—'}</td><td class="p-3 text-center whitespace-nowrap"><button class="edit px-2 py-1 rounded bg-slate-100 font-bold" data-name="${esc(p.name)}">ערוך</button><button class="del px-2 py-1 rounded bg-red-50 text-red-600 font-bold mr-1" data-name="${esc(p.name)}">מחק</button></td></tr>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.name));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.name))}
function openEdit(name){editing=products.find(p=>p.name===name);if(!editing)return;$('edit-name').value=editing.name;$('edit-price').value=editing.price;$('edit-error').classList.add('hidden');$('edit-modal').classList.remove('hidden');$('edit-modal').classList.add('flex')}
$('cancel-edit').onclick=()=>{$('edit-modal').classList.add('hidden');$('edit-modal').classList.remove('flex')};$('save-edit').onclick=async()=>{if(!editing)return;try{const r=await fetch(`/api/products/${encodeURIComponent(editing.name)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('edit-name').value.trim(),price:$('edit-price').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'שגיאה בעדכון');$('edit-modal').classList.add('hidden');$('edit-modal').classList.remove('flex');await loadProducts();await loadReport()}catch(x){$('edit-error').textContent=x.message;$('edit-error').classList.remove('hidden')}};
async function deleteProduct(name){if(!confirm(`למחוק את המוצר "${name}"?`))return;try{const r=await fetch(`/api/products/${encodeURIComponent(name)}`,{method:'DELETE'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'שגיאה במחיקה');await loadProducts()}catch(x){alert(x.message)}}
$('table-search').oninput=renderRows;$('product-search').oninput=renderProducts;$('load-report').onclick=loadReport;document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{const d=new Date();if(b.dataset.months){$('start-date').value=monthsAgo(Number(b.dataset.months));$('end-date').value=iso(d)}else if(b.dataset.month){d.setDate(1);$('start-date').value=iso(d);$('end-date').value=iso(new Date())}else{$('start-date').value=iso(new Date(Date.now()-7*86400000));$('end-date').value=iso(new Date())}loadReport()});document.addEventListener('DOMContentLoaded',()=>{const e=new Date();$('end-date').value=iso(e);$('start-date').value=monthsAgo(3);loadReport();loadProducts()});
</script></body></html>
