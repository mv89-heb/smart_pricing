<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>דוח חיובים לפי תקופה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Heebo, sans-serif; }
    .number { direction:ltr; unicode-bidi:plaintext; }
    .sticky-head th { position:sticky; top:0; z-index:5; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-chart-column"></i></div>
        <div class="min-w-0">
          <h1 class="font-extrabold text-lg sm:text-xl truncate">דוח חיובים לפי תקופה</h1>
          <p class="text-xs text-slate-500 hidden sm:block">הצגה מלאה של כל החיובים בטווח שנבחר</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/daily" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-pen-to-square"></i><span class="hidden sm:inline">דיווח יומי</span></a>
        <a href="/logout" class="px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline">יציאה</span></a>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-4 lg:px-8 py-6 space-y-5">
    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 lg:p-5">
      <div class="flex flex-col xl:flex-row xl:items-end gap-4 justify-between">
        <div>
          <h2 class="text-lg font-extrabold">תקופת הדוח</h2>
          <p class="text-sm text-slate-500">ברירת המחדל היא 3 חודשים אחורה ועד היום.</p>
        </div>
        <div class="flex flex-wrap items-end gap-2">
          <label class="text-sm font-bold">מתאריך<input id="start-date" type="date" class="block mt-1 px-3 py-2 border rounded-lg bg-white"></label>
          <label class="text-sm font-bold">עד תאריך<input id="end-date" type="date" class="block mt-1 px-3 py-2 border rounded-lg bg-white"></label>
          <button data-months="3" class="preset active px-3 py-2 rounded-lg bg-indigo-600 text-white font-bold text-sm">3 חודשים</button>
          <button data-days="7" class="preset px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold text-sm">7 ימים</button>
          <button data-month="current" class="preset px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold text-sm">חודש נוכחי</button>
          <button data-months="6" class="preset px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold text-sm">6 חודשים</button>
          <button id="load-report" class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm"><i class="fa-solid fa-rotate"></i> הצג נתונים</button>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-2 lg:grid-cols-5 gap-3">
      <div class="bg-white rounded-xl border p-4"><p class="text-xs text-slate-500">מספר חיובים</p><p id="summary-entries" class="text-2xl font-extrabold mt-1">0</p></div>
      <div class="bg-white rounded-xl border p-4"><p class="text-xs text-slate-500">סה"כ כמות</p><p id="summary-quantity" class="text-2xl font-extrabold mt-1">0</p></div>
      <div class="bg-white rounded-xl border p-4"><p class="text-xs text-slate-500">חיובים רגילים</p><p id="summary-regular" class="text-2xl font-extrabold mt-1 text-indigo-700">0 ₪</p></div>
      <div class="bg-white rounded-xl border p-4"><p class="text-xs text-slate-500">אקסטרה</p><p id="summary-extra" class="text-2xl font-extrabold mt-1 text-orange-600">0 ₪</p></div>
      <div class="bg-slate-900 text-white rounded-xl border border-slate-900 p-4 col-span-2 lg:col-span-1"><p class="text-xs text-slate-300">סה"כ לתקופה</p><p id="summary-total" class="text-2xl font-extrabold mt-1">0 ₪</p></div>
    </section>

    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="p-4 border-b bg-slate-50 flex flex-col sm:flex-row gap-3 justify-between items-center">
        <div class="font-bold"><span id="period-label">טוען...</span> <span id="row-count" class="text-xs text-slate-500"></span></div>
        <input id="table-search" type="search" placeholder="חיפוש לפי מוצר או תאריך..." class="w-full sm:w-80 px-3 py-2 border rounded-lg bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="overflow-auto max-h-[calc(100vh-330px)]">
        <table class="min-w-full text-sm">
          <thead class="sticky-head bg-slate-100">
            <tr>
              <th class="px-4 py-3 text-right font-bold">תאריך</th>
              <th class="px-4 py-3 text-right font-bold">מוצר</th>
              <th class="px-4 py-3 text-center font-bold">סוג</th>
              <th class="px-4 py-3 text-center font-bold">כמות</th>
              <th class="px-4 py-3 text-center font-bold">מחיר יחידה</th>
              <th class="px-4 py-3 text-center font-bold">סה"כ</th>
            </tr>
          </thead>
          <tbody id="report-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div id="empty-state" class="hidden p-12 text-center text-slate-500"><i class="fa-regular fa-folder-open text-3xl mb-3"></i><p class="font-bold">אין חיובים בתקופה שנבחרה</p></div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let rows = [];
function iso(d) { return d.toISOString().slice(0,10); }
function money(v) { return new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0) + ' ₪'; }
function fmtDate(v) { const [y,m,d]=v.split('-'); return `${d}/${m}/${y}`; }
function monthsAgo(months) { const d=new Date(); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-months); return iso(d); }
function setPreset(btn) { document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active','bg-indigo-600','text-white')); btn.classList.add('active','bg-indigo-600','text-white'); }
async function loadReport() {
  const start=$('start-date').value, end=$('end-date').value;
  if (!start || !end) return;
  const btn=$('load-report'); btn.disabled=true; btn.textContent='טוען...';
  try {
    const res=await fetch(`/api/report/range?start_date=${encodeURIComponent(start)}&end_date=${encodeURIComponent(end)}`);
    const data=await res.json();
    if (!res.ok) throw new Error(data.error || 'שגיאה בטעינת הדוח');
    rows=data.rows || [];
    $('summary-entries').textContent=data.summary.entries.toLocaleString('he-IL');
    $('summary-quantity').textContent=Number(data.summary.quantity||0).toLocaleString('he-IL',{maximumFractionDigits:2});
    $('summary-regular').textContent=money(data.summary.regular_total);
    $('summary-extra').textContent=money(data.summary.extra_total);
    $('summary-total').textContent=money(data.summary.grand_total);
    $('period-label').textContent=`${fmtDate(start)} — ${fmtDate(end)}`;
    renderTable();
  } catch(e) { alert(e.message); }
  finally { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-rotate"></i> הצג נתונים'; }
}
function renderTable() {
  const q=$('table-search').value.trim().toLowerCase();
  const visible=rows.filter(r => `${r.date} ${r.product_name}`.toLowerCase().includes(q));
  $('row-count').textContent=`(${visible.length.toLocaleString('he-IL')} שורות)`;
  $('empty-state').classList.toggle('hidden', visible.length !== 0);
  $('report-body').innerHTML=visible.map(r=>`<tr class="hover:bg-slate-50 ${r.is_extra?'bg-orange-50/30':''}"><td class="px-4 py-3 font-medium whitespace-nowrap">${fmtDate(r.date)}</td><td class="px-4 py-3 font-semibold">${escapeHtml(r.product_name)}</td><td class="px-4 py-3 text-center">${r.is_extra?'<span class="px-2 py-1 rounded-full bg-orange-100 text-orange-700 text-xs font-bold">אקסטרה</span>':'<span class="px-2 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold">רגיל</span>'}</td><td class="px-4 py-3 text-center number">${Number(r.quantity).toLocaleString('he-IL',{maximumFractionDigits:2})}</td><td class="px-4 py-3 text-center number">${money(r.unit_price)}</td><td class="px-4 py-3 text-center font-extrabold number">${money(r.total)}</td></tr>`).join('');
}
function escapeHtml(v) { return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
$('load-report').addEventListener('click',loadReport);
$('table-search').addEventListener('input',renderTable);
document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>{
  setPreset(btn); const now=new Date(); $('end-date').value=iso(now);
  if(btn.dataset.months) $('start-date').value=monthsAgo(Number(btn.dataset.months));
  else if(btn.dataset.days) { const d=new Date(); d.setDate(d.getDate()-Number(btn.dataset.days)); $('start-date').value=iso(d); }
  else if(btn.dataset.month==='current') { $('start-date').value=iso(new Date(now.getFullYear(),now.getMonth(),1)); }
  loadReport();
}));
const today=new Date(); $('end-date').value=iso(today); $('start-date').value=monthsAgo(3); loadReport();
</script>
</body>
</html>
