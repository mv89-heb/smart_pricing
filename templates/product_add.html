<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Pricing — הוספת מוצרים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{font-family:Heebo,sans-serif;background:#f8fafc}.number{direction:ltr;unicode-bidi:plaintext}</style>
</head>
<body class="min-h-screen">
<main class="max-w-3xl mx-auto px-4 py-8 lg:py-12">
  <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <header class="p-6 border-b border-slate-100"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-indigo-600 text-white flex items-center justify-center"><i class="fa-solid fa-box-open"></i></div><div><h1 class="text-2xl font-extrabold">הוספת מוצרים למערכת</h1><p class="text-sm text-slate-500">הוסף מוצר חדש והמחיר שלו יהיה זמין מיד לחיובים חדשים.</p></div></div></header>
    <form id="product-form" class="p-6 space-y-5">
      <div><label class="block text-sm font-bold text-slate-700 mb-2">שם מוצר</label><input id="name" required maxlength="100" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="לדוגמה: חלב 3%"></div>
      <div><label class="block text-sm font-bold text-slate-700 mb-2">מחיר</label><div class="relative"><span class="absolute right-4 top-3.5 text-slate-400">₪</span><input id="price" required type="number" min="0" step="0.01" class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 number" placeholder="0.00"></div></div>
      <div id="message" class="hidden rounded-xl p-3 text-sm font-bold"></div>
      <div class="flex gap-3"><button class="flex-1 px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold" type="submit"><i class="fa-solid fa-plus"></i> הוסף מוצר</button><a href="/" class="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold">חזרה לדוח</a></div>
    </form>
  </section>
  <section class="mt-5 bg-white rounded-2xl border border-slate-200 p-5 text-sm text-slate-600"><i class="fa-regular fa-clock text-indigo-600"></i> תאריך ההוספה נשמר אוטומטית במערכת ומוצג במחירון.</section>
</main>
<script>
const form=document.getElementById('product-form'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='hidden';const payload={name:document.getElementById('name').value.trim(),price:document.getElementById('price').value};try{const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'לא ניתן להוסיף את המוצר');msg.textContent='המוצר נוסף בהצלחה';msg.className='rounded-xl p-3 text-sm font-bold bg-emerald-50 text-emerald-700';form.reset();}catch(err){msg.textContent=err.message;msg.className='rounded-xl p-3 text-sm font-bold bg-red-50 text-red-700'}});
</script></body></html>
