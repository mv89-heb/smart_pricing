<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Pricing — אנליטיקה ודאשבורד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/static/ux-refresh.css">
</head>
<body><main class="sp-page px-3 sm:px-5 lg:px-7 py-5">
<header class="sp-card sp-page-head"><div><div class="sp-kicker">SMART PRICING · ANALYTICS</div><h1 class="sp-title">אנליטיקה ודאשבורד</h1><p id="period" class="sp-subtitle">טוען תקופה...</p></div>
<div class="sp-actions"><button id="refresh" class="sp-btn"><i class="fa-solid fa-rotate-right"></i> רענן</button><button id="print" class="sp-btn"><i class="fa-solid fa-print"></i> הדפסה</button><a href="/" class="sp-btn primary"><i class="fa-solid fa-chart-column"></i> דוח חיובים</a><a href="/products/new" class="sp-btn">מחירון</a><a href="/logout" class="sp-btn danger"><i class="fa-solid fa-right-from-bracket"></i> יציאה</a></div></header>
<section class="sp-card mb-4"><div class="sp-toolbar"><div class="sp-field"><label>מתאריך</label><input id="start" type="date"></div><div class="sp-field"><label>עד תאריך</label><input id="end" type="date"></div><button class="sp-btn" data-p="7">7 ימים</button><button class="sp-btn" data-p="30">30 ימים</button><button class="sp-btn primary" data-p="3m">3 חודשים</button><button class="sp-btn" data-p="6m">6 חודשים</button><button id="load" class="sp-btn dark">עדכן</button></div></section>
<section class="sp-card mb-4"><div class="sp-toolbar">
<input id="dash-search" class="sp-search" placeholder="חיפוש מוצר, תאריך או סוג...">
<select id="dash-product" class="sp-search"><option value="">כל המוצרים</option></select>
<select id="dash-category" class="sp-search"><option value="">כל הקטגוריות</option></select>
<select id="dash-type" class="sp-search"><option value="">רגיל + אקסטרה</option><option value="regular">רגיל בלבד</option><option value="extra">אקסטרה בלבד</option></select>
<input id="dash-min-price" type="number" min="0" step="0.01" class="sp-search" placeholder="מחיר יחידה מינ׳">
<input id="dash-max-price" type="number" min="0" step="0.01" class="sp-search" placeholder="מחיר יחידה מקס׳">
<span id="dash-filter-count" class="text-xs font-bold text-slate-500"></span>
</div></section>
<section class="sp-card mb-4"><div class="sp-kpis"><div class="sp-kpi primary"><div class="label">מספר חיובים</div><div id="entries" class="value">—</div></div><div class="sp-kpi"><div class="label">סה״כ כמות</div><div id="qty" class="value">—</div></div><div class="sp-kpi success"><div class="label">רגילים</div><div id="regular" class="value">—</div></div><div class="sp-kpi warn"><div class="label">אקסטרות</div><div id="extra" class="value">—</div></div><div class="sp-kpi dark"><div class="label">סה״כ לתקופה</div><div id="total" class="value">—</div></div></div></section>
<section class="sp-grid-3"><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-chart-pie text-indigo-600"></i> רגיל מול אקסטרה</h2><div class="sp-chart-box"><canvas id="split"></canvas></div></article><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-chart-bar text-indigo-600"></i> היקף לפי מוצר</h2><div class="sp-chart-box"><canvas id="products"></canvas></div></article><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-ranking-star text-amber-500"></i> המוצרים המובילים</h2><div class="sp-chart-box"><canvas id="top"></canvas></div></article></section>
<section class="sp-grid-2 mt-4"><div class="sp-card p-5"><h2 class="sp-section-title">תובנות מהירות</h2><div id="insights" class="grid sm:grid-cols-2 gap-3"></div></div><div class="sp-card p-5"><h2 class="sp-section-title">מצב נתונים</h2><div class="sp-insight"><div class="sp-status"><span class="sp-dot"></span> המידע נשלף ישירות מהדוח המאוחד</div><p id="status" class="text-sm text-slate-500 mt-2">—</p></div></div></section>
</main>
<script src="/static/smart-filters.js"></script>
<script>
const $=id=>document.getElementById(id);
let charts=[],products=[],currentRows=[];
const iso=d=>d.toISOString().slice(0,10), money=v=>new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' ₪';
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)}, months=n=>{const d=new Date();d.setMonth(d.getMonth()-n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function populateDashboardFilters(){SmartFilters.populateSelect($('dash-product'),products.map(p=>p.name),'כל המוצרים');SmartFilters.populateSelect($('dash-category'),products.map(p=>p.category||'כללי'),'כל הקטגוריות')}
function getFilteredRows(){const filtered=SmartFilters.filterRows(currentRows,{query:$('dash-search').value,product:$('dash-product').value,category:$('dash-category').value,type:$('dash-type').value,minPrice:$('dash-min-price').value,maxPrice:$('dash-max-price').value});$('dash-filter-count').textContent=filtered.length===currentRows.length?`${filtered.length.toLocaleString('he-IL')} רשומות`:`${filtered.length.toLocaleString('he-IL')} מתוך ${currentRows.length.toLocaleString('he-IL')}`;return filtered}
function renderDashboard(){const rows=getFilteredRows(),regularRows=rows.filter(x=>!x.is_extra),extraRows=rows.filter(x=>x.is_extra);const regularTotal=regularRows.reduce((s,x)=>s+Number(x.total||0),0),extraTotal=extraRows.reduce((s,x)=>s+Number(x.total||0),0),total=regularTotal+extraTotal,qty=rows.reduce((s,x)=>s+Number(x.quantity||0),0);$('entries').textContent=rows.length.toLocaleString('he-IL');$('qty').textContent=qty.toLocaleString('he-IL',{maximumFractionDigits:2});$('regular').textContent=money(regularTotal);$('extra').textContent=money(extraTotal);$('total').textContent=money(total);
const totals={};rows.forEach(x=>totals[x.product_name]=(totals[x.product_name]||0)+Number(x.total||0));const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);charts.forEach(c=>c.destroy());charts=[];const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};charts.push(new Chart($('split'),{type:'doughnut',data:{labels:['רגיל','אקסטרה'],datasets:[{data:[regularTotal,extraTotal]}]},options:base}));charts.push(new Chart($('products'),{type:'bar',data:{labels:sorted.map(x=>x[0]),datasets:[{label:'₪',data:sorted.map(x=>x[1])}]},options:{...base,indexAxis:'y',plugins:{legend:{display:false}}}}));const top=sorted.slice(0,8);charts.push(new Chart($('top'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'₪',data:top.map(x=>x[1])}]},options:{...base,plugins:{legend:{display:false}}}}));const avg=rows.length?total/rows.length:0;$('insights').innerHTML=`<div class="sp-insight"><span class="text-xs text-slate-500">מוצר מוביל</span><br><strong>${sorted[0]?esc(sorted[0][0]):'—'}</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">ממוצע לחיוב</span><br><strong>${money(avg)}</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">חלק האקסטרות</span><br><strong>${total?Math.round(extraTotal/total*100):0}%</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">מוצרים פעילים בדוח</span><br><strong>${sorted.length.toLocaleString('he-IL')}</strong></div>}
async function load(){const s=$('start').value,e=$('end').value;if(!s||!e)return;if(s>e){alert('טווח התאריכים אינו תקין');return}const b=$('load');b.disabled=true;try{const [rr,pr]=await Promise.all([fetch(`/api/report/range?start_date=${encodeURIComponent(s)}&end_date=${encodeURIComponent(e)}`,{cache:'no-store'}),fetch('/api/vat/products',{cache:'no-store'})]);const d=await rr.json(),pd=await pr.json();if(!rr.ok)throw Error(d.error||'שגיאה בטעינת הדוח');currentRows=d.rows||[];products=pd.products||[];populateDashboardFilters();$('period').textContent=`נתונים: ${s} — ${e}`;renderDashboard();$('status').textContent=`עודכן ${new Date().toLocaleString('he-IL')}`}catch(e){$('status').textContent='שגיאה';alert(e.message)}finally{b.disabled=false}}
function preset(v){$('end').value=iso(new Date());$('start').value=v==='7'?ago(7):v==='30'?ago(30):v==='6m'?months(6):months(3);load()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>preset(b.dataset.p));$('load').onclick=load;$('refresh').onclick=load;$('print').onclick=()=>window.print();
['dash-search','dash-product','dash-category','dash-type','dash-min-price','dash-max-price'].forEach(id=>$(id).addEventListener('input',renderDashboard));
document.addEventListener('DOMContentLoaded',()=>{$('end').value=iso(new Date());$('start').value=months(3);load()});
</script></body></html>
