<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Pricing — אנליטיקה ודאשבורד</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/static/ux-refresh.css"></head><body><main class="sp-page px-3 sm:px-5 lg:px-7 py-5"><header class="sp-card sp-page-head"><div><div class="sp-kicker">SMART PRICING · ANALYTICS</div><h1 class="sp-title">אנליטיקה ודאשבורד</h1><p id="period" class="sp-subtitle">טוען תקופה...</p></div><div class="sp-actions"><button id="refresh" class="sp-btn"><i class="fa-solid fa-rotate-right"></i> רענן</button><button id="print" class="sp-btn"><i class="fa-solid fa-print"></i> הדפסה</button><a href="/" class="sp-btn primary"><i class="fa-solid fa-chart-column"></i> דוח חיובים</a><a href="/logout" class="sp-btn danger"><i class="fa-solid fa-right-from-bracket"></i> יציאה</a></div></header>
<section class="sp-card mb-4"><div class="sp-toolbar"><div class="sp-field"><label>מתאריך</label><input id="start" type="date"></div><div class="sp-field"><label>עד תאריך</label><input id="end" type="date"></div><button class="sp-btn" data-p="7">7 ימים</button><button class="sp-btn" data-p="30">30 ימים</button><button class="sp-btn primary" data-p="3m">3 חודשים</button><button class="sp-btn" data-p="6m">6 חודשים</button><button id="load" class="sp-btn dark">עדכן</button></div></section>
<section class="sp-card mb-4"><div class="sp-kpis"><div class="sp-kpi primary"><div class="label">מספר חיובים</div><div id="entries" class="value">—</div></div><div class="sp-kpi"><div class="label">סה״כ כמות</div><div id="qty" class="value">—</div></div><div class="sp-kpi success"><div class="label">רגילים</div><div id="regular" class="value">—</div></div><div class="sp-kpi warn"><div class="label">אקסטרות</div><div id="extra" class="value">—</div></div><div class="sp-kpi dark"><div class="label">סה״כ לתקופה</div><div id="total" class="value">—</div></div></div></section>
<section class="sp-grid-3"><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-chart-pie text-indigo-600"></i> רגיל מול אקסטרה</h2><div class="sp-chart-box"><canvas id="split"></canvas></div></article><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-chart-bar text-indigo-600"></i> היקף לפי מוצר</h2><div class="sp-chart-box"><canvas id="products"></canvas></div></article><article class="sp-card sp-chart-card"><h2 class="sp-section-title"><i class="fa-solid fa-ranking-star text-amber-500"></i> המוצרים המובילים</h2><div class="sp-chart-box"><canvas id="top"></canvas></div></article></section>
<section class="sp-grid-2 mt-4"><div class="sp-card p-5"><h2 class="sp-section-title">תובנות מהירות</h2><div id="insights" class="grid sm:grid-cols-2 gap-3"></div></div><div class="sp-card p-5"><h2 class="sp-section-title">מצב נתונים</h2><div class="sp-insight"><div class="sp-status"><span class="sp-dot"></span> המידע נשלף ישירות מהדוח המאוחד</div><p id="status" class="text-sm text-slate-500 mt-2">—</p></div></div></section></main>
<script>const $=id=>document.getElementById(id);let charts=[];const iso=d=>d.toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' ₪';const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};const months=n=>{const d=new Date();d.setMonth(d.getMonth()-n);return iso(d)};async function load(){const s=$('start').value,e=$('end').value;if(!s||!e)return;const b=$('load');b.disabled=true;try{const r=await fetch(`/api/report/range?start_date=${encodeURIComponent(s)}&end_date=${encodeURIComponent(e)}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');const rows=d.rows||[],sum=d.summary||{};$('entries').textContent=Number(sum.entries||0).toLocaleString('he-IL');$('qty').textContent=Number(sum.quantity||0).toLocaleString('he-IL',{maximumFractionDigits:2});$('regular').textContent=money(sum.regular_total);$('extra').textContent=money(sum.extra_total);$('total').textContent=money(sum.grand_total);$('period').textContent=`נתונים: ${s} — ${e}`;const totals={};rows.forEach(x=>totals[x.product_name]=(totals[x.product_name]||0)+Number(x.total||0));const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);charts.forEach(c=>c.destroy());charts=[];const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};charts.push(new Chart($('split'),{type:'doughnut',data:{labels:['רגיל','אקסטרה'],datasets:[{data:[Number(sum.regular_total)||0,Number(sum.extra_total)||0]}]},options:base}));charts.push(new Chart($('products'),{type:'bar',data:{labels:sorted.map(x=>x[0]),datasets:[{label:'₪',data:sorted.map(x=>x[1])}]},options:{...base,indexAxis:'y',plugins:{legend:{display:false}}}}));const top=sorted.slice(0,8);charts.push(new Chart($('top'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'₪',data:top.map(x=>x[1])}]},options:{...base,plugins:{legend:{display:false}}}}));const total=Number(sum.grand_total)||0,extra=Number(sum.extra_total)||0,avg=Number(sum.entries)?total/Number(sum.entries):0;$('insights').innerHTML=`<div class="sp-insight"><span class="text-xs text-slate-500">מוצר מוביל</span><br><strong>${sorted[0]?esc(sorted[0][0]):'—'}</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">ממוצע לחיוב</span><br><strong>${money(avg)}</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">חלק האקסטרות</span><br><strong>${total?Math.round(extra/total*100):0}%</strong></div><div class="sp-insight"><span class="text-xs text-slate-500">מוצרים פעילים בדוח</span><br><strong>${sorted.length.toLocaleString('he-IL')}</strong></div>`;$('status').textContent=`עודכן ${new Date().toLocaleString('he-IL')}`}catch(e){alert(e.message)}finally{b.disabled=false}}function preset(v){$('end').value=iso(new Date());$('start').value=v==='7'?ago(7):v==='30'?ago(30):v==='6m'?months(6):months(3);load()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>preset(b.dataset.p));$('load').onclick=load;$('refresh').onclick=load;$('print').onclick=()=>window.print();document.addEventListener('DOMContentLoaded',()=>{$('end').value=iso(new Date());$('start').value=months(3);load()});</script></body></html>
