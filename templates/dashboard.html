<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | ניהול חיובים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Heebo','sans-serif']}}}}</script>
<style>body{font-family:Heebo,sans-serif}.num{font-variant-numeric:tabular-nums}</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto p-4 sm:p-6">
<header class="flex flex-col sm:flex-row justify-between gap-4 items-start sm:items-center mb-6">
<div><p class="text-indigo-600 font-bold text-sm">מרכז שליטה</p><h1 class="text-3xl font-extrabold">Dashboard חיובים</h1><p id="subtitle" class="text-slate-500 text-sm mt-1"></p></div>
<div class="flex gap-2 flex-wrap"><a href="/" class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-bold">יומי</a><a href="/periodic-report" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">דוח תקופתי</a><button onclick="toggleDark()" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">◐</button></div>
</header>
<section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500 font-bold">החודש</p><p id="monthTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p><p id="monthDelta" class="text-xs mt-1"></p></div>
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500 font-bold">היום</p><p id="todayTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p></div>
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500 font-bold">ממוצע יומי</p><p id="avgTotal" class="num text-2xl font-extrabold mt-1">₪0.00</p></div>
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500 font-bold">שוטף</p><p id="regularTotal" class="num text-xl font-extrabold text-indigo-600 mt-1">₪0.00</p></div>
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500 font-bold">אקסטרה</p><p id="extraTotal" class="num text-xl font-extrabold text-amber-600 mt-1">₪0.00</p></div>
</section>
<section class="grid lg:grid-cols-3 gap-5 mb-5">
<div class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-extrabold">מגמת חיובים</h2><span id="daysLabel" class="text-xs text-slate-500"></span></div><div class="h-72"><canvas id="trend"></canvas></div></div>
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5"><h2 class="font-extrabold mb-4">מובילים לפי מוצר</h2><div id="products" class="space-y-3"></div></div>
</section>
<section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 mb-5">
<div class="flex flex-col sm:flex-row gap-3 justify-between sm:items-center mb-4"><div><h2 class="font-extrabold">השוואת תקופות</h2><p class="text-xs text-slate-500">בחר שתי תקופות וראה שינוי אמיתי בסכומים</p></div><div class="flex gap-2 flex-wrap"><input id="aFrom" type="date" class="px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950"><input id="aTo" type="date" class="px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950"><input id="bFrom" type="date" class="px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950"><input id="bTo" type="date" class="px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950"><button onclick="compare()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">השווה</button></div></div>
<div id="compareGrid" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
</section>
<section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-extrabold">סטטוס תקופה</h2><span id="lockStatus" class="text-xs font-bold"></span></div><div class="flex gap-2"><input id="lockMonth" type="month" class="px-3 py-2 rounded-lg border dark:border-slate-700 bg-white dark:bg-slate-950"><button onclick="lockPeriod()" class="px-4 py-2 rounded-lg bg-slate-800 text-white font-bold">נעילת חודש</button><button onclick="unlockPeriod()" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-bold">פתיחת חודש</button></div><p id="lockMsg" class="text-xs text-slate-500 mt-3"></p></section>
</div>
<script>
const $=id=>document.getElementById(id); const money=n=>'₪'+(Number(n)||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(url,opt={}){const r=await fetch(url,opt);if(r.status===401){location.href='/login';return null}return r}
function isoToday(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function monthBounds(offset=0){const d=new Date();d.setMonth(d.getMonth()+offset);const y=d.getFullYear(),m=d.getMonth();return [new Date(y,m,1),new Date(y,m+1,0)]}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function report(from,to){const r=await api('/api/report/period?from='+from+'&to='+to);return r&&r.ok?r.json():{summary:{},entries:[],product_summary:{},day_summary:{}}}
async function init(){const [f,t]=monthBounds(0),[pf,pt]=monthBounds(-1);const now=isoToday();$('subtitle').textContent='נתוני חודש '+f.toLocaleDateString('he-IL',{month:'long',year:'numeric'});const cur=await report(fmt(f),fmt(t));const prev=await report(fmt(pf),fmt(pt));const today=await report(now,now);const s=cur.summary||{};$('monthTotal').textContent=money(s.grand_total);$('todayTotal').textContent=money(today.summary?.grand_total);$('avgTotal').textContent=money(s.average_day);$('regularTotal').textContent=money(s.regular_total);$('extraTotal').textContent=money(s.extra_total);const delta=(Number(s.grand_total)||0)-(Number(prev.summary?.grand_total)||0);const pct=prev.summary?.grand_total?delta/prev.summary.grand_total*100:0;$('monthDelta').textContent=(delta>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(1)+'% לעומת החודש הקודם';$('monthDelta').className='text-xs mt-1 '+(delta>=0?'text-emerald-600':'text-rose-600');$('daysLabel').textContent=(s.days_count||0)+' ימים';renderChart(cur.day_summary||{});renderProducts(cur.product_summary||{});setCompareDefaults();$('lockMonth').value=f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0');await refreshLock();}
function renderChart(days){const labels=Object.keys(days).sort();new Chart($('trend'),{type:'line',data:{labels,datasets:[{label:'סה״כ',data:labels.map(x=>days[x].total),tension:.3,fill:true},{label:'שוטף',data:labels.map(x=>days[x].regular),tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}})}
function renderProducts(m){const rows=Object.entries(m).sort((a,b)=>b[1].total-a[1].total).slice(0,8);const max=rows[0]?.[1].total||1;$('products').innerHTML=rows.map(([name,x])=>`<div><div class="flex justify-between text-sm font-bold"><span>${escapeHtml(name)}</span><span>${money(x.total)}</span></div><div class="h-2 bg-slate-100 dark:bg-slate-800 rounded-full mt-1"><div class="h-2 bg-indigo-500 rounded-full" style="width:${Math.min(100,x.total/max*100)}%"></div></div></div>`).join('')||'<p class="text-slate-400 text-sm">אין נתונים</p>'}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setCompareDefaults(){const [f,t]=monthBounds(0),[pf,pt]=monthBounds(-1);$('aFrom').value=fmt(f);$('aTo').value=fmt(t);$('bFrom').value=fmt(pf);$('bTo').value=fmt(pt)}
async function compare(){const a=await report($('aFrom').value,$('aTo').value),b=await report($('bFrom').value,$('bTo').value);const at=Number(a.summary?.grand_total)||0,bt=Number(b.summary?.grand_total)||0;const d=at-bt,p=bt?d/bt*100:0;$('compareGrid').innerHTML=[['תקופה א׳',at,0],['תקופה ב׳',bt,0],['שינוי',d,p]].map(x=>`<div class="rounded-xl bg-slate-50 dark:bg-slate-950 p-4"><p class="text-xs text-slate-500 font-bold">${x[0]}</p><p class="num text-2xl font-extrabold mt-1 ${x[0]==='שינוי'?(d>=0?'text-emerald-600':'text-rose-600'):''}">${money(x[1])}</p>${x[0]==='שינוי'?`<p class="text-sm font-bold">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</p>`:''}</div>`).join('')}
async function refreshLock(){const m=$('lockMonth').value;if(!m)return;const r=await api('/api/period-locks/'+m);if(r&&r.ok){const x=await r.json();$('lockStatus').textContent=x.locked?'🔒 נעול':'🟢 פתוח';$('lockStatus').className='text-xs font-bold '+(x.locked?'text-rose-600':'text-emerald-600');$('lockMsg').textContent=x.locked?'החודש נעול לשינויים.':'החודש פתוח לעריכה.'}}
async function lockPeriod(){const m=$('lockMonth').value;if(!m)return;const r=await api('/api/period-locks/'+m,{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}});if(r&&r.ok)await refreshLock();else alert('נדרש מנהל או שהפעולה נכשלה')}
async function unlockPeriod(){const m=$('lockMonth').value;if(!m)return;const r=await api('/api/period-locks/'+m,{method:'DELETE',headers:{'X-Requested-With':'XMLHttpRequest'}});if(r&&r.ok)await refreshLock();else alert('נדרש מנהל או שהפעולה נכשלה')}
function toggleDark(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}
if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');init();
</script>
</body></html>
