<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Pricing — דשבורד</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/static/navigation.css"></head><body class="bg-slate-50 text-slate-800 min-h-screen"><main class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6"><header class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 mb-5 flex items-center justify-between gap-4"><div><h1 class="text-2xl font-extrabold">אנליטיקה ודאשבורד</h1><p id="period-label" class="text-sm text-slate-500">נתוני החודש הנוכחי</p></div><a href="/" class="px-4 py-2 rounded-lg bg-slate-100 font-bold">חזרה לדוח</a></header><section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 mb-5 flex flex-wrap items-end gap-3"><label class="text-xs font-bold">מתאריך<input id="start" type="date" class="block mt-1 px-3 py-2 border rounded-lg"></label><label class="text-xs font-bold">עד תאריך<input id="end" type="date" class="block mt-1 px-3 py-2 border rounded-lg"></label><button id="load" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">עדכן דשבורד</button></section><section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5"><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500">מספר חיובים</p><b id="entries" class="text-3xl">0</b></div><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500">סה״כ כמות</p><b id="qty" class="text-3xl">0</b></div><div class="bg-white border rounded-2xl p-5"><p class="text-xs text-slate-500">חיובים רגילים</p><b id="regular" class="text-3xl text-indigo-600">0 ₪</b></div><div class="bg-slate-900 text-white rounded-2xl p-5"><p class="text-xs text-slate-300">סה״כ לתקופה</p><b id="total" class="text-3xl">0 ₪</b></div></section><section class="grid grid-cols-1 lg:grid-cols-3 gap-5"><div class="bg-white border rounded-2xl p-5 min-h-[360px]"><h2 class="font-bold mb-3">רגיל מול אקסטרה</h2><div class="h-[290px]"><canvas id="split"></canvas></div></div><div class="bg-white border rounded-2xl p-5 min-h-[360px]"><h2 class="font-bold mb-3">פילוח לפי מוצר</h2><div class="h-[290px]"><canvas id="products"></canvas></div></div><div class="bg-white border rounded-2xl p-5 min-h-[360px]"><h2 class="font-bold mb-3">מוצרים מובילים</h2><div class="h-[290px]"><canvas id="top"></canvas></div></div></section></main><script>const $=id=>document.getElementById(id);const iso=d=>d.toISOString().slice(0,10);const money=v=>new Intl.NumberFormat('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' ₪';let charts=[];function monthStart(){const d=new Date();d.setDate(1);return iso(d)}async function load(){const s=$('start').value,e=$('end').value;if(!s||!e)return;const b=$('load');b.disabled=true;try{const r=await fetch(`/api/report/range?start_date=${s}&end_date=${e}`);const d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');const rows=d.rows||[];$('entries').textContent=(d.summary.entries||0).toLocaleString('he-IL');$('qty').textContent=(d.summary.quantity||0).toLocaleString('he-IL',{maximumFractionDigits:2});$('regular').textContent=money(d.summary.regular_total);$('total').textContent=money(d.summary.grand_total);$('period-label').textContent=`דשבורד: ${s} — ${e}`;const extra=Number(d.summary.extra_total)||0;const totals={};rows.forEach(x=>totals[x.product_name]=(totals[x.product_name]||0)+Number(x.total||0));const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);charts.forEach(c=>c.destroy());charts=[];charts.push(new Chart($('split'),{type:'doughnut',data:{labels:['רגיל','אקסטרה'],datasets:[{data:[Number(d.summary.regular_total)||0,extra]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}));charts.push(new Chart($('products'),{type:'bar',data:{labels:sorted.map(x=>x[0]),datasets:[{label:'סה״כ ₪',data:sorted.map(x=>x[1])}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}}}));const top=sorted.slice(0,8);charts.push(new Chart($('top'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'סה״כ ₪',data:top.map(x=>x[1])}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}}))}catch(x){alert(x.message)}finally{b.disabled=false}}document.addEventListener('DOMContentLoaded',()=>{const e=new Date();$('end').value=iso(e);$('start').value=monthStart();load()});$('load').onclick=load</script></body></html>
