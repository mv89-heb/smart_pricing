<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>היסטוריית חיובים | Smart Pricing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Heebo,sans-serif}.num{font-variant-numeric:tabular-nums}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div class="max-w-7xl mx-auto p-4 sm:p-6">
<header class="flex flex-col sm:flex-row justify-between gap-3 items-start sm:items-center mb-6">
  <div><div class="text-indigo-600 font-bold text-sm">Smart Pricing</div><h1 class="text-3xl font-extrabold">כל החיובים וההיסטוריה</h1><p id="status" class="text-sm text-slate-500 mt-1">טוען נתונים...</p></div>
  <div class="flex gap-2 flex-wrap"><a href="/" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">יומי</a><button onclick="loadLast3()" class="px-4 py-2 rounded-lg bg-white border font-bold">3 חודשים אחרונים</button><button onclick="loadAll()" class="px-4 py-2 rounded-lg bg-white border font-bold">כל הנתונים</button></div>
</header>
<section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">
 <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500 font-bold">סה״כ</div><div id="grand" class="num text-2xl font-extrabold">₪0.00</div></div>
 <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500 font-bold">שוטף</div><div id="regular" class="num text-xl font-extrabold text-indigo-600">₪0.00</div></div>
 <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500 font-bold">אקסטרה</div><div id="extra" class="num text-xl font-extrabold text-amber-600">₪0.00</div></div>
 <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500 font-bold">ימי חיוב</div><div id="days" class="num text-xl font-extrabold">0</div></div>
 <div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-500 font-bold">רשומות</div><div id="count" class="num text-xl font-extrabold">0</div></div>
</section>
<section class="bg-white rounded-2xl border p-4 mb-5">
 <div class="flex flex-wrap gap-3 items-end">
  <div><label class="block text-xs font-bold text-slate-500 mb-1">מתאריך</label><input id="from" type="date" class="px-3 py-2 rounded-lg border"></div>
  <div><label class="block text-xs font-bold text-slate-500 mb-1">עד תאריך</label><input id="to" type="date" class="px-3 py-2 rounded-lg border"></div>
  <button onclick="loadCustom()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">הצג טווח</button>
 </div>
</section>
<section class="bg-white rounded-2xl border overflow-hidden">
 <div class="p-4 border-b"><h2 class="font-extrabold">פירוט מלא</h2></div>
 <div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-slate-50"><tr><th class="px-4 py-3 text-right">תאריך</th><th class="px-4 py-3 text-right">מוצר</th><th class="px-4 py-3">סוג</th><th class="px-4 py-3">כמות</th><th class="px-4 py-3">מחיר יח׳</th><th class="px-4 py-3">סה״כ</th><th class="px-4 py-3 text-right">הערה</th></tr></thead><tbody id="rows"></tbody></table></div>
 <div id="empty" class="hidden p-12 text-center text-slate-400 font-bold">לא נמצאו חיובים בטווח הזה.</div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const money=n=>'₪'+(Number(n)||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,d.getDate())}
async function api(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401){location='/login';return null}return r}
function render(x){const s=x.summary||{};$('grand').textContent=money(s.grand_total);$('regular').textContent=money(s.regular_total);$('extra').textContent=money(s.extra_total);$('days').textContent=s.days_count||0;$('count').textContent=(x.entries||[]).length;$('status').textContent=x.from&&x.to?`נתונים מ-${x.from.split('-').reverse().join('/')} עד ${x.to.split('-').reverse().join('/')}`:`כל ההיסטוריה`;const rows=x.entries||[];$('empty').classList.toggle('hidden',rows.length>0);$('rows').innerHTML=rows.map(e=>`<tr class="border-b"><td class="px-4 py-2">${esc(e.date)}</td><td class="px-4 py-2 font-bold">${esc(e.product_name)}</td><td class="px-4 py-2 text-center">${e.is_extra?'אקסטרה':'שוטף'}</td><td class="px-4 py-2 text-center">${Number(e.quantity).toLocaleString('he-IL')}</td><td class="px-4 py-2 text-center">${money(e.unit_price)}</td><td class="px-4 py-2 text-center font-bold">${money(e.total_amount)}</td><td class="px-4 py-2">${esc(e.note||'')}</td></tr>`).join('')}
async function loadRange(a,b){$('status').textContent='טוען...';const r=await api('/api/report/period?from='+encodeURIComponent(a)+'&to='+encodeURIComponent(b));if(!r||!r.ok){$('status').textContent='לא ניתן לטעון את הנתונים';return}render(await r.json())}
async function loadLast3(){const now=new Date();const from=new Date(now.getFullYear(),now.getMonth()-2,1);const to=new Date(now.getFullYear(),now.getMonth()+1,0);$('from').value=localDate(from);$('to').value=localDate(to);await loadRange(localDate(from),localDate(to))}
async function loadAll(){const r=await api('/api/report/all');if(!r||!r.ok){$('status').textContent='לא ניתן לטעון את כל ההיסטוריה';return}render(await r.json())}
async function loadCustom(){const a=$('from').value,b=$('to').value;if(!a||!b||a>b){$('status').textContent='טווח תאריכים לא תקין';return}await loadRange(a,b)}
loadLast3();
</script>
</body></html>
