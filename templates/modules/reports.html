{% extends 'base.html' %}{% block title %}דוחות | Smart Pricing{% endblock %}{% block content %}<div class="p-6 lg:p-10 max-w-7xl mx-auto"><div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><h2 class="text-4xl font-black">דוחות</h2><p class="text-slate-500">כל תקופה לבחירה, ללא תלות בדיווח היומי</p></div><div class="flex gap-2"><input id="from" type="date" class="border rounded-xl p-3"><input id="to" type="date" class="border rounded-xl p-3"><button id="load" class="bg-blue-600 text-white rounded-xl px-5 font-bold">הצג</button></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"><div class="bg-white rounded-2xl border p-5"><small>סה״כ</small><div id="grand" class="text-2xl font-black">0 ₪</div></div><div class="bg-white rounded-2xl border p-5"><small>שוטף</small><div id="regular" class="text-2xl font-black">0 ₪</div></div><div class="bg-white rounded-2xl border p-5"><small>אקסטרה</small><div id="extra" class="text-2xl font-black">0 ₪</div></div><div class="bg-white rounded-2xl border p-5"><small>ימי חיוב</small><div id="days" class="text-2xl font-black">0</div></div></div><div class="bg-white rounded-2xl border overflow-hidden"><div class="p-5 border-b font-black">פירוט</div><div class="overflow-x-auto"><table class="w-full text-right"><thead class="bg-slate-50"><tr><th class="p-4">תאריך</th><th class="p-4">מוצר</th><th class="p-4">סוג</th><th class="p-4">כמות</th><th class="p-4">מחיר</th><th class="p-4">סה״כ</th><th class="p-4">הערה</th></tr></thead><tbody id="body"></tbody></table></div></div></div>{% endblock %}{% block scripts %}<script>const n=new Date();from.value=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);to.value=n.toISOString().slice(0,10);async function load(){try{const x=await api('/api/reports?start='+from.value+'&end='+to.value);grand.textContent=x.totals.grand.toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';regular.textContent=x.totals.regular.toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';extra.textContent=(x.totals.extra+x.totals.special).toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';days.textContent=x.totals.days;body.innerHTML=x.entries.map(e=>`<tr class="border-t"><td class="p-4">${e.date}</td><td class="p-4 font-bold">${e.product_name}</td><td class="p-4">${e.entry_type}</td><td class="p-4">${e.quantity}</td><td class="p-4">${e.price_at_time.toFixed(2)} ₪</td><td class="p-4 font-black">${e.total.toLocaleString(undefined,{minimumFractionDigits:2})} ₪</td><td class="p-4">${e.notes||''}</td></tr>`).join('')||'<tr><td colspan="7" class="p-10 text-center text-slate-400">אין נתונים</td></tr>'}catch(e){toast(e.message,false)}}load();document.getElementById('load').onclick=load;</script>{% endblock %}
