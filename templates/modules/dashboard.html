{% extends 'base.html' %}{% block title %}דשבורד | Smart Pricing{% endblock %}{% block content %}<div class="p-6 lg:p-10 max-w-7xl mx-auto"><div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><h2 class="text-4xl font-black">דשבורד</h2><p class="text-slate-500 mt-1">הנתונים נטענים ישירות ממסד הנתונים</p></div><div class="flex gap-2"><input id="dash-from" type="date" class="border rounded-xl p-3"><input id="dash-to" type="date" class="border rounded-xl p-3"><button id="dash-load" class="bg-blue-600 text-white rounded-xl px-5 font-bold">עדכן</button></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"><div class="bg-white rounded-2xl p-5 border"><div class="text-xs text-slate-400 font-bold">סה״כ</div><div id="dash-total" class="text-2xl font-black mt-2">0.00 ₪</div></div><div class="bg-white rounded-2xl p-5 border"><div class="text-xs text-slate-400 font-bold">שוטף</div><div id="dash-regular" class="text-2xl font-black mt-2">0.00 ₪</div></div><div class="bg-white rounded-2xl p-5 border"><div class="text-xs text-slate-400 font-bold">אקסטרה</div><div id="dash-extra" class="text-2xl font-black mt-2">0.00 ₪</div></div><div class="bg-white rounded-2xl p-5 border"><div class="text-xs text-slate-400 font-bold">ימי חיוב</div><div id="dash-days" class="text-2xl font-black mt-2">0</div></div></div><div class="bg-white rounded-2xl border overflow-hidden"><div class="p-5 border-b font-black">סיכום לפי מוצר</div><table class="w-full text-right"><thead class="bg-slate-50"><tr><th class="p-4">מוצר</th><th class="p-4">כמות</th><th class="p-4">סה״כ</th></tr></thead><tbody id="dash-products"></tbody></table></div></div>{% endblock %}{% block scripts %}<script>const d=new Date(),f=document.getElementById('dash-from'),t=document.getElementById('dash-to');f.value=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);t.value=d.toISOString().slice(0,10);async function loadDash(){try{const x=await api('/api/reports?start='+f.value+'&end='+t.value);document.getElementById('dash-total').textContent=x.totals.grand.toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';document.getElementById('dash-regular').textContent=x.totals.regular.toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';document.getElementById('dash-extra').textContent=(x.totals.extra+x.totals.special).toLocaleString(undefined,{minimumFractionDigits:2})+' ₪';document.getElementById('dash-days').textContent=x.totals.days;document.getElementById('dash-products').innerHTML=x.products.map(p=>`<tr class="border-t"><td class="p-4 font-bold">${p.name}</td><td class="p-4">${p.qty}</td><td class="p-4 font-black">${p.sum.toLocaleString(undefined,{minimumFractionDigits:2})} ₪</td></tr>`).join('')||'<tr><td colspan="3" class="p-8 text-center text-slate-400">אין נתונים</td></tr>'}catch(e){toast(e.message,false)}}document.getElementById('dash-load').addEventListener('click',loadDash);loadDash();</script>{% endblock %}
