{% extends "base.html" %}{% block title %}מחירון | Smart Pricing{% endblock %}{% block content %}
<section class="saas-card"><div class="saas-card-header"><div><h2 style="margin:0;font-size:18px">מחירון</h2><p style="margin:3px 0 0;color:#64748b;font-size:12px">ניהול מוצרים, מחירים ותוקף מחיר</p></div><button id="add-product" class="saas-button">הוסף מוצר</button></div><div class="saas-card-body"><div class="saas-toolbar" style="margin-bottom:12px"><input id="pricing-search" class="saas-input saas-quick-search" placeholder="🔎 חיפוש מהיר במחירון..."><span id="pricing-count" style="font-size:12px;color:#64748b"></span></div><div class="saas-table-wrap"><table class="saas-table"><thead><tr><th>מוצר <button class="saas-filter-button" data-filter="name">⌄</button></th><th>תגית</th><th>מחיר <button class="saas-filter-button" data-filter="price">⌄</button></th><th>מחיר עתידי</th><th>פעולות</th></tr></thead><tbody id="pricing-body"></tbody></table></div></div></section>
<div id="pricing-drawer" class="saas-drawer-backdrop" hidden><aside class="saas-drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="pricing-drawer-title">מוצר</h2><button id="pricing-close" class="saas-icon-button">×</button></div><form id="pricing-form" class="saas-form-grid"><input type="hidden" id="pricing-original"><label>שם מוצר<input id="pricing-name" required maxlength="100"></label><label>מחיר<input id="pricing-price" type="number" min="0" step="0.01" required></label><label>תגית<input id="pricing-tag" maxlength="80"></label><label>תאריך תוקף<input id="pricing-effective" type="date"></label><button class="saas-button" type="submit">שמור</button></form></aside></div>
{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='pricing-module.js') }}?v=1" defer></script>{% endblock %}
